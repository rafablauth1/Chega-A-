<!doctype html>
<!--
  Ícone do app. Renderizado em PNG pelo scripts/icon/render.sh (Edge/Chrome headless).
  Variações (?v=): full (ícone iOS/legado), fg (frente do ícone adaptável do Android),
  bg (fundo do adaptável), mono (ícone temático do Android 13+), splash.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'BigShoulders';
    /* o render.ts troca pelo arquivo embutido (navegador não carrega fonte de file://) */
    src: url('FONT_URL');
  }
  html, body { margin: 0; background: transparent; }
  svg { display: block; width: 1024px; height: 1024px; }
</style>
</head>
<body>
<svg id="icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <g id="turf">
    <rect width="1024" height="1024" fill="#0F2419"/>
    <rect x="128" width="128" height="1024" fill="#123020"/>
    <rect x="384" width="128" height="1024" fill="#123020"/>
    <rect x="640" width="128" height="1024" fill="#123020"/>
    <rect x="896" width="128" height="1024" fill="#123020"/>
  </g>
  <g id="chalk" fill="none" stroke="#F2F5EE" stroke-opacity="0.22" stroke-width="16">
    <circle cx="512" cy="512" r="330"/>
    <line x1="0" y1="512" x2="1024" y2="512"/>
  </g>
  <g id="bib">
    <!-- colete: alças, gola e cavas -->
    <path id="bibShape" fill="#FF7A1A" d="
      M 352 232 L 436 232
      Q 512 336 588 232
      L 672 232
      C 676 330 712 398 752 420
      L 752 786 Q 752 810 728 810
      L 296 810 Q 272 810 272 786
      L 272 420
      C 312 398 348 330 352 232 Z"/>
    <!-- acabamento da gola e da barra -->
    <path d="M 436 232 Q 512 336 588 232" fill="none" stroke="#C85A0C" stroke-width="18" stroke-linecap="round"/>
    <clipPath id="bibClip"><use href="#bibShape"/></clipPath>
    <rect x="272" y="772" width="480" height="38" fill="#C85A0C" opacity="0.55" clip-path="url(#bibClip)"/>
    <text id="num" x="512" y="705" text-anchor="middle" font-family="BigShoulders" font-size="330" fill="#0F2419" letter-spacing="-6">10</text>
  </g>
</svg>
<script>
  const v = new URLSearchParams(location.search).get('v') || 'full';
  const $ = (id) => document.getElementById(id);
  if (v === 'fg' || v === 'mono' || v === 'splash') {
    $('turf').remove();
    $('chalk').remove();
    // Zona segura do ícone adaptável: o conteúdo precisa caber no círculo central (66%)
    $('bib').setAttribute('transform', v === 'splash' ? 'translate(512 512) scale(0.9) translate(-512 -521)' : 'translate(512 512) scale(0.74) translate(-512 -521)');
  }
  if (v === 'bg') $('bib').remove();
  if (v === 'mono') {
    // Silhueta branca com o número vazado (o Android pinta com a cor do tema)
    const ns = 'http://www.w3.org/2000/svg';
    $('bibShape').setAttribute('fill', '#FFFFFF');
    document.querySelectorAll('#bib path:not(#bibShape), #bib rect').forEach((el) => el.remove());
    const mask = document.createElementNS(ns, 'mask');
    mask.setAttribute('id', 'cut');
    mask.setAttribute('maskUnits', 'userSpaceOnUse');
    mask.setAttribute('x', '0'); mask.setAttribute('y', '0');
    mask.setAttribute('width', '1024'); mask.setAttribute('height', '1024');
    const white = document.createElementNS(ns, 'rect');
    white.setAttribute('width', '1024'); white.setAttribute('height', '1024'); white.setAttribute('fill', 'white');
    const hole = $('num').cloneNode(true);
    hole.removeAttribute('id');
    hole.setAttribute('fill', 'black');
    mask.append(white, hole);
    $('icon').prepend(mask);
    $('bibShape').setAttribute('mask', 'url(#cut)');
    $('num').remove();
  }
</script>
</body>
</html>
